server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/despachos {
        # Usa el nombre que pusiste en 'container_name' del docker-compose
        proxy_pass http://despachos-api:8080; 
        proxy_set_header Host $host;
    }

    location /api/v1/ventas {
        proxy_pass http://ventas-api:8081;
        proxy_set_header Host $host;
    }
}