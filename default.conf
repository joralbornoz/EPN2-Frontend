server {
    listen 80;
    
    # DNS interno de Docker (Obligatorio para que funcione la variable)
    resolver 127.0.0.11 valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/despachos {
        # Usamos una variable para que Nginx no falle si el backend tarda en subir
        set $backend_despachos despachos-api;
        proxy_pass http://$backend_despachos:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/ventas {
        set $backend_ventas ventas-api;
        proxy_pass http://$backend_ventas:8081;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}