server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # PROXY PARA DESPACHOS (IE7: Comunicación estable)
    location /api/v1/despachos {
        proxy_pass http://despachos-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PROXY PARA VENTAS (IE7: Comunicación estable)
    location /api/v1/ventas {
        proxy_pass http://ventas-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Manejo de errores para evitar que React reciba HTML en lugar de JSON
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}